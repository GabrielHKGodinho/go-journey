<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Diário — Transição para Go</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0B0F14;
    --panel:#121820;
    --panel-2:#182130;
    --line:#232E3D;
    --text:#E6EDF3;
    --muted:#7C8B99;
    --accent:#2DD4BF;
    --accent-dim:#134E4A;
    --amber:#F5A623;
    --amber-dim:#4A3510;
    --danger:#F87171;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; padding:28px 18px 60px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  h1{font-family:'IBM Plex Mono',monospace;font-size:22px;margin:6px 0 0;font-weight:600;}
  .streak{
    font-family:'IBM Plex Mono',monospace;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 16px;text-align:center;min-width:120px;
  }
  .streak .n{font-size:26px;color:var(--amber);font-weight:700;display:block;}
  .streak .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .phase-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--bg);background:var(--accent);
    padding:3px 9px;border-radius:5px;font-weight:700;letter-spacing:.04em;margin-bottom:10px;}
  .day-title{font-size:19px;font-weight:700;margin:0 0 4px;}
  .day-meta{color:var(--muted);font-size:13px;margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}
  .field-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 5px;}
  .field-value{line-height:1.55;font-size:15px;}
  .resource{display:inline-block;margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amber);background:var(--amber-dim);
    padding:4px 10px;border-radius:6px;}
  .question-box{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel-2);border-radius:0 6px 6px 0;font-style:italic;color:var(--text);}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);
    padding:10px 16px;cursor:pointer;background:var(--panel-2);color:var(--text);transition:all .15s;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#04201D;border:none;}
  button.primary:hover{filter:brightness(1.08);}
  button.done{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}

  textarea{
    width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:12px;resize:vertical;margin-top:6px;
  }
  textarea:focus{outline:none;border-color:var(--accent);}

  .grid-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
  .calendar{display:grid;grid-template-columns:repeat(21,1fr);gap:4px;}
  .cell{
    aspect-ratio:1;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;position:relative;
  }
  .cell.today{outline:2px solid var(--amber);outline-offset:1px;}
  .cell.done{background:var(--accent);border-color:var(--accent);}
  .cell.future{opacity:.35;}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .copy-hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#04201D;
    padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .peek{margin-top:12px;padding:12px;background:var(--panel-2);border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted);}
  .empty{color:var(--muted);text-align:center;padding:30px 0;}
</style>
</head>

    <div class="legend">

  </div>

</div>

const DATA_MAP = {};
DATA.forEach(row=>{
  DATA_MAP[row[0]] = {date:row[0], phase:row[1], foco:row[2], acao:row[3], rec:row[4], pergunta:row[5]};
});

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const dt = new Date(y,m-1,d);
  return dias[dt.getDay()]+' '+d+'/'+m+'/'+y;
}

let doneMap = {};
let notesMap = {};

async function loadState(){
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const r = await window.storage.get('go-roadmap-done');
      if (r && r.value) doneMap = JSON.parse(r.value);
      const r2 = await window.storage.get('go-roadmap-notes');
      if (r2 && r2.value) notesMap = JSON.parse(r2.value);
    }
  } catch(e){}

  try {
    const r = localStorage.getItem('go-roadmap-done');
    if (r) doneMap = JSON.parse(r);
  } catch(e){}
  try {
    const r2 = localStorage.getItem('go-roadmap-notes');
    if (r2) notesMap = JSON.parse(r2);
  } catch(e){}

  // Tenta carregar arquivo de dados local em caso de execução via servidor local
  try {
    const res = await fetch('./go-roadmap-dados.json');
    if (res.ok) {
      const data = await res.json();
      if (data.doneMap) doneMap = Object.assign({}, data.doneMap, doneMap);
      if (data.notesMap) notesMap = Object.assign({}, data.notesMap, notesMap);
    }
  } catch(e){}
}

async function saveDone(){
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set('go-roadmap-done', JSON.stringify(doneMap));
    }
  } catch(e){}
  try {
    localStorage.setItem('go-roadmap-done', JSON.stringify(doneMap));
  } catch(e){}
}

async function saveNotes(){
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set('go-roadmap-notes', JSON.stringify(notesMap));
    }
  } catch(e){}
  try {
    localStorage.setItem('go-roadmap-notes', JSON.stringify(notesMap));
  } catch(e){}
}

function exportJSON(){
  const payload = {
    doneMap: doneMap,
    notesMap: notesMap,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'go-roadmap-dados.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Arquivo go-roadmap-dados.json exportado!');
}

function importJSON(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.doneMap) doneMap = data.doneMap;
      if(data.notesMap) notesMap = data.notesMap;
      await saveDone();
      await saveNotes();
      document.getElementById('streakNum').textContent = computeStreak();
      renderDay(currentDate);
      renderCalendar();
      toast('Dados importados com sucesso!');
    } catch(err) {
      toast('Erro ao ler arquivo JSON.');
    }
  };
  reader.readAsText(file);
}

function computeStreak(){
  let streak=0;
  let d = new Date();
  while(true){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(doneMap[iso]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

let currentDate = todayISO();

function renderDay(iso){
  currentDate = iso;
  const entry = DATA_MAP[iso];
  const card = document.getElementById('dayCard');
  if(!entry){
    const before = iso < DATA[0][0];
    card.innerHTML = `<div class="empty">${before ? 'Ainda não começou — o roadmap inicia em 28/07/2026.' : 'Fora do período do roadmap (ou ele já terminou — parabéns por chegar até aqui!).'}</div>`;
    document.getElementById('noteInput').value='';
    return;
  }
  card.innerHTML = `
    <div class="phase-tag">Fase ${entry.phase} · ${PHASES[entry.phase]}</div>
    <div class="day-title">${entry.foco}</div>
    <div class="day-meta">${fmtDate(entry.date)}</div>
    <div class="field-label">O que fazer</div>
    <div class="field-value">${entry.acao}</div>
    <div class="field-label">Recurso</div>
    <div><span class="resource">${entry.rec}</span></div>
    <div class="field-label">Pergunta de autoavaliação</div>
    <div class="question-box">${entry.pergunta}</div>
  `;
  document.getElementById('noteInput').value = notesMap[iso] || '';
  document.getElementById('markDoneBtn').classList.toggle('done', !!doneMap[iso]);
  document.getElementById('markDoneBtn').textContent = doneMap[iso] ? '✓ Concluído' : 'Marcar dia como concluído';
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  const today = todayISO();
  DATA.forEach(row=>{
    const iso = row[0];
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(iso===today) cell.classList.add('today');
    if(doneMap[iso]) cell.classList.add('done');
    if(iso>today) cell.classList.add('future');
    cell.title = fmtDate(iso)+' — '+row[2];
    cell.addEventListener('click', ()=>{
      renderDay(iso);
      showPeek(iso);
      window.scrollTo({top:0, behavior:'smooth'});
    });
    cal.appendChild(cell);
  });
}

function showPeek(iso){
  const box = document.getElementById('peekBox');
  const entry = DATA_MAP[iso];
  if(!entry){ box.style.display='none'; return; }
  box.style.display='block';
  box.textContent = fmtDate(iso)+' — '+entry.foco+(notesMap[iso] ? ' · nota salva ✓' : '');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

document.getElementById('saveNoteBtn').addEventListener('click', async ()=>{
  notesMap[currentDate] = document.getElementById('noteInput').value;
  await saveNotes();
  toast('Anotação salva.');
});

document.getElementById('noteInput').addEventListener('input', async ()=>{
  notesMap[currentDate] = document.getElementById('noteInput').value;
  await saveNotes();
});

document.getElementById('markDoneBtn').addEventListener('click', async ()=>{
  doneMap[currentDate] = !doneMap[currentDate];
  await saveDone();
  document.getElementById('streakNum').textContent = computeStreak();
  renderDay(currentDate);
  renderCalendar();
  toast(doneMap[currentDate] ? 'Dia marcado como concluído!' : 'Marcação removida.');
});

document.getElementById('copyPromptBtn').addEventListener('click', ()=>{
  const entry = DATA_MAP[currentDate];
  let prompt;
  if(entry){
    prompt = `Estou no dia ${fmtDate(entry.date)} do meu roadmap de transição para Go (Fase ${entry.phase} — ${PHASES[entry.phase]}). A tarefa de hoje é: "${entry.foco}". Ação prevista: ${entry.acao} Recurso sugerido: ${entry.rec}. Pergunta de autoavaliação do dia: "${entry.pergunta}". Me explique tim-tim por tim-tim o que fazer, com exemplos de código em Go quando fizer sentido, e me faça perguntas ao longo do caminho para checar se eu realmente entendi antes de avançar.`;
  } else {
    prompt = `Estou seguindo meu roadmap de transição para Go, mas hoje (${fmtDate(currentDate)}) está fora do período mapeado. Me ajude a decidir o que revisar ou adiantar.`;
  }
  navigator.clipboard.writeText(prompt).then(()=>toast('Prompt copiado! Cole no chat comigo.'))
    .catch(()=>toast('Não foi possível copiar automaticamente — selecione o texto manualmente.'));
});

document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
document.getElementById('importJsonBtn').addEventListener('click', ()=>{
  document.getElementById('importJsonInput').click();
});
document.getElementById('importJsonInput').addEventListener('change', (e)=>{
  if(e.target.files && e.target.files[0]){
    importJSON(e.target.files[0]);
    e.target.value = '';
  }
});

(async function init(){
  await loadState();
  document.getElementById('streakNum').textContent = computeStreak();
  renderDay(todayISO());
  renderCalendar();
})();
</script>
