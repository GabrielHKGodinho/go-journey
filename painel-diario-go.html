<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A2B; --surface:#15243A; --surface-2:#1C2E48; --line:#2A3F5E;
    --text:#E8EEF6; --muted:#8DA2BE; --accent:#00ADD8; --on-accent:#03202A;
    --note:#F2C94C; --note-bg:rgba(242,201,76,.08);
    --ok:#5DD39E; --bad:#F2777A;
    --p1:#7FB3FF; --p2:#B79CFF; --p3:#FF8FB1; --p4:#FFC46B; --p5:#00ADD8; --p6:#FF9F6B; --p7:#5DD39E;
    --on-phase:#0B1424; --radius-lg:14px; --radius-sm:7px;
    --sans:'Instrument Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EDF2F8; --line:#D5DEE9;
      --text:#13233A; --muted:#5A6E88; --accent:#007D9C; --on-accent:#FFFFFF;
      --note:#9A6B00; --note-bg:rgba(183,134,11,.08);
      --ok:#1E8A5A; --bad:#C2413F;
      --on-phase:#FFFFFF; --p1:#3B7DDB; --p2:#7C5CD6; --p3:#D4497A; --p4:#C98A12; --p5:#007D9C; --p6:#D56A2E; --p7:#1E8A5A;
    }
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 72px;}
  button,input,textarea{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

  /* Header + journey track */
  .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px;}
  .head h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;}
  .head .sub{color:var(--muted);margin-top:4px;}
  .head .tools{display:flex;gap:8px;flex-wrap:wrap;}

  .journey{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px 22px 18px;margin-bottom:18px;}
  .journey-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .journey-top .big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .journey-top .big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px;}
  .facts{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:14px;}
  .facts b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  .facts .late b{color:var(--bad);}
  .track{position:relative;height:56px;}
  .track-bar{position:absolute;left:0;right:0;top:18px;height:14px;display:flex;border-radius:999px;overflow:hidden;background:var(--surface-2);}
  .seg{position:relative;height:100%;border-right:2px solid var(--surface);}
  .seg:last-child{border-right:0;}
  .seg .fill{position:absolute;inset:0 auto 0 0;background:var(--c);}
  .seg .rest{position:absolute;inset:0;background:var(--c);opacity:.18;}
  .seg button{position:absolute;inset:-6px 0;background:transparent;border:0;cursor:pointer;padding:0;}
  .flag{position:absolute;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .flag i{width:2px;height:40px;background:var(--text);opacity:.55;}
  .flag span{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:2px;}
  .flag.goal i{background:var(--note);opacity:1;}
  .flag.goal span{color:var(--note);font-weight:600;}
  .flag.pass i{background:var(--ok);opacity:1;}
  .flag.fail i{background:var(--bad);opacity:1;}
  .here{position:absolute;top:8px;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--text);}
  .phase-names{display:flex;margin-top:4px;}
  .phase-names div{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;}
  .phase-names div.on{color:var(--text);font-weight:600;}

  /* Day navigation */
  .daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .daynav .date{font-size:18px;font-weight:600;min-width:170px;text-align:center;font-variant-numeric:tabular-nums;}
  .daynav .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.2;}
  .btn:hover{border-color:var(--accent);}
  .btn.icon{padding:8px 11px;font-size:16px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
  .btn.done{background:transparent;border-color:var(--ok);color:var(--ok);font-weight:600;}
  .btn.small{padding:5px 9px;font-size:13px;}

  /* Main grid */
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;}
  .grid.lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:18px;}
  @media (max-width:820px){ .grid,.grid.lower{grid-template-columns:minmax(0,1fr);} }
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;}
  .panel h2{font-size:16px;margin:0 0 12px;font-weight:600;}
  .panel .hint{color:var(--muted);font-size:13px;}

  .day{border-top:4px solid var(--pc,var(--accent));}
  .day-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;}
  .chip.phase{background:var(--pc);color:var(--on-phase);}
  .chip.fmt{border:1px solid var(--line);color:var(--muted);font-weight:500;}
  .day h3{font-size:22px;line-height:1.25;margin:4px 0 14px;font-weight:700;letter-spacing:-.01em;}
  .block{margin:0 0 14px;}
  .block .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:3px;}
  .block p{margin:0;}
  .blocks2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media (max-width:560px){ .blocks2{grid-template-columns:1fr;} }
  .blocks2 .block{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:0;}
  .res{display:flex;flex-wrap:wrap;gap:6px;}
  .res a,.res span{font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--text);text-decoration:none;border:1px solid var(--line);}
  .res a:hover{border-color:var(--accent);}
  .question{border-left:3px solid var(--note);background:var(--note-bg);padding:11px 14px;border-radius:0 10px 10px 0;margin-top:4px;}
  .question .lbl{color:var(--note);}
  .day-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .empty{color:var(--muted);padding:24px 0;text-align:center;}

  textarea{width:100%;min-height:300px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical;line-height:1.6;}
  textarea:focus{outline:none;border-color:var(--accent);}
  .note-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px;}
  .saved{color:var(--ok);}

  /* Funnel */
  .counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .counter{background:var(--surface-2);border-radius:10px;padding:10px 12px;}
  .counter .lbl{font-size:12.5px;color:var(--muted);}
  .counter .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;}
  .counter .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .counter .pm{display:flex;gap:4px;}
  .totals{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px 10px;font-size:13.5px;font-variant-numeric:tabular-nums;}
  .totals .h{color:var(--muted);font-size:12.5px;}
  .bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:14px;}
  .bars div{flex:1;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;min-height:2px;position:relative;}
  .bars div.zero{opacity:.2;}
  .bars-x{display:flex;gap:5px;margin-top:4px;}
  .bars-x span{flex:1;font-size:10.5px;color:var(--muted);text-align:center;}

  /* Checkpoints */
  .cp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);}
  .cp:first-of-type{border-top:0;padding-top:2px;}
  .cp .when{font-variant-numeric:tabular-nums;font-weight:600;}
  .cp .left{color:var(--muted);font-size:13px;}
  .cp .crit{font-weight:500;}
  .cp .fail{color:var(--muted);font-size:13px;}
  .cp .st{display:flex;gap:6px;margin-top:6px;}
  .cp .st .btn.on-pass{border-color:var(--ok);color:var(--ok);}
  .cp .st .btn.on-fail{border-color:var(--bad);color:var(--bad);}

  /* Extras + search */
  .add{display:flex;gap:8px;margin-bottom:10px;}
  .search input{width:100%;}
  .add input,.search input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;min-width:0;}
  .add input:focus,.search input:focus{outline:none;border-color:var(--accent);}
  ul.extras{list-style:none;margin:0;padding:0;}
  ul.extras li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);}
  ul.extras li:first-child{border-top:0;}
  ul.extras li.done span{text-decoration:line-through;color:var(--muted);}
  ul.extras li span{flex:1;}
  ul.extras input{margin-top:5px;accent-color:var(--accent);}
  .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .x:hover{color:var(--bad);}
  .results{margin-top:10px;max-height:340px;overflow:auto;}
  .result{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;}
  .result:hover .rd{color:var(--accent);}
  .result .rd{font-weight:600;font-size:13.5px;}
  .result .rs{color:var(--muted);font-size:13px;}
  .result mark{background:var(--note-bg);color:var(--note);border-radius:3px;padding:0 2px;}

  /* Calendar */
  .months{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 20px;}
  .month .mname{font-weight:600;margin-bottom:6px;}
  .wk,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .wk span{font-size:10.5px;color:var(--muted);text-align:center;}
  .cell{aspect-ratio:1;border-radius:5px;border:0;padding:0;font-size:11px;font-variant-numeric:tabular-nums;cursor:pointer;position:relative;background:transparent;color:var(--muted);}
  .cell.in{background:color-mix(in srgb, var(--c) 20%, transparent);color:var(--text);}
  .cell.in.ok{background:var(--c);color:var(--on-phase);font-weight:600;}
  .cell.today{box-shadow:0 0 0 2px var(--text);}
  .cell.sel{box-shadow:0 0 0 2px var(--accent);}
  .cell.has-note::after{content:"";position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--note);}
  .cell.out{cursor:default;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  @media (max-width:600px){
    .phase-names{display:none;}
    .flag span{display:none;}
    .flag.goal span{display:block;}
    .journey-top .big{font-size:32px;}
    .months{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .cell{font-size:10px;border-radius:4px;}
    .daynav .date{min-width:0;font-size:16px;}
  }
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:10;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div>
      <h1>Painel Go</h1>
      <div class="sub">De 28/07/2026 até a oferta em 31/03/2027</div>
    </div>
    <div class="tools">
      <button class="btn small" id="exportJsonBtn" title="Baixar go-roadmap-dados.json com tudo o que está salvo">Exportar dados</button>
      <button class="btn small" id="importJsonBtn" title="Carregar um go-roadmap-dados.json">Importar dados</button>
      <input type="file" id="importJsonInput" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="journey" aria-label="Progresso da jornada">
    <div class="journey-top">
      <div class="big" id="pct">0%<small>do caminho</small></div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="track" id="track"></div>
    <div class="phase-names" id="phaseNames"></div>
  </section>

  <nav class="daynav" aria-label="Navegar entre dias">
    <button class="btn icon" id="prevBtn" title="Dia anterior (seta ←)" aria-label="Dia anterior">‹</button>
    <div class="date" id="navDate" aria-live="polite"></div>
    <button class="btn icon" id="nextBtn" title="Próximo dia (seta →)" aria-label="Próximo dia">›</button>
    <div class="spacer"></div>
    <button class="btn small" id="pendingBtn">Próximo pendente</button>
    <button class="btn small" id="todayBtn">Hoje</button>
  </nav>

  <div class="grid">
    <article class="panel day" id="dayCard"></article>
    <section class="panel" aria-labelledby="noteTitle">
      <h2 id="noteTitle">Caderno do dia</h2>
      <label class="sr" for="noteInput">Anotação do dia</label>
      <textarea id="noteInput" placeholder="O que você aprendeu, o que ficou confuso e a resposta da pergunta de autoavaliação."></textarea>
      <div class="note-foot"><span id="noteCount">0 caracteres</span><span id="noteStatus"></span></div>
    </section>
  </div>

  <div class="grid lower">
    <section class="panel" aria-labelledby="funnelTitle">
      <h2 id="funnelTitle">Funil de candidaturas</h2>
      <div id="funnel"></div>
    </section>
    <section class="panel" aria-labelledby="cpTitle">
      <h2 id="cpTitle">Checkpoints</h2>
      <div id="checkpoints"></div>
    </section>
  </div>

  <div class="grid lower">
    <section class="panel" aria-labelledby="extrasTitle">
      <h2 id="extrasTitle">Extras para o fim de semana</h2>
      <p class="hint" style="margin:-6px 0 12px">Aprofundamentos que não couberam na 1h30 do dia útil.</p>
      <form class="add" id="extraForm">
        <label class="sr" for="extraInput">Novo extra</label>
        <input id="extraInput" placeholder="Ex.: medir o frame da recursão com debug.SetMaxStack" autocomplete="off">
        <button class="btn small" type="submit">Adicionar</button>
      </form>
      <ul class="extras" id="extrasList"></ul>
    </section>
    <section class="panel search" aria-labelledby="searchTitle">
      <h2 id="searchTitle">Buscar nas anotações</h2>
      <label class="sr" for="searchInput">Texto para buscar</label>
      <input id="searchInput" placeholder="Ex.: snapshot, idempotência, Big-O" autocomplete="off">
      <div class="results" id="results"></div>
    </section>
  </div>

  <section class="panel" style="margin-top:18px" aria-labelledby="calTitle">
    <h2 id="calTitle">Calendário</h2>
    <div class="months" id="months"></div>
    <div class="legend" id="legend"></div>
  </section>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PHASES = {
  1:{name:"Fundamentos", full:"Fundamentos & Reposicionamento", color:"var(--p1)"},
  2:{name:"Concorrência", full:"Concorrência", color:"var(--p2)"},
  3:{name:"Projeto âncora", full:"Projeto Âncora Distribuído", color:"var(--p3)"},
  4:{name:"Algoritmos e design", full:"Algoritmos, System Design & Comportamental", color:"var(--p4)"},
  5:{name:"Candidaturas", full:"Prospecção ativa + estudo", color:"var(--p5)"},
  6:{name:"Dezembro", full:"Dezembro: processos + estudo", color:"var(--p6)"},
  7:{name:"Revisão e fechamento", full:"Super revisão, aprofundamento e fechamento", color:"var(--p7)"}
};

const FUNNEL_START = "2026-11-02";
const GOAL_DATE = "2027-03-31";

const CHECKPOINTS = [
  {id:"cp1", date:"2026-12-15", label:"Checkpoint 1", crit:"Pelo menos 1 triagem marcada.", fail:"Se não passar: revisar currículo, mensagens e canais na mesma semana."},
  {id:"cp2", date:"2027-01-31", label:"Checkpoint 2", crit:"Algum processo passou da triagem.", fail:"Se não passar: ver onde os processos param (RH ou técnica) e treinar essa etapa."},
  {id:"cp3", date:"2027-02-28", label:"Checkpoint 3", crit:"Algum processo em etapa final.", fail:"Se não passar: março provavelmente escorrega; ajustar o plano com base nos números."},
  {id:"goal", date:GOAL_DATE, label:"Meta", crit:"Oferta em mãos até 31/03.", fail:"Se não chegar: seguir buscando empregado, corrigindo o ponto fraco que os checkpoints mostraram."}
];

// [date, phase, focus, study/action, resource, question, applications-block?]
const ROWS = [
["2026-07-28",1,"Ambiente + mentalidade","Instale Go e a extensão Go do VSCode. Configure o Cursor/Claude como tutor socrático (peça para explicar erros, não corrigir sozinho). Faça a seção Basics do Tour of Go: pacotes, variáveis, tipos.","go.dev/tour","O que é um pacote em Go e por que main é especial?"],
["2026-07-29",1,"Tipos e controle de fluxo","Continue o Tour of Go: for, if, switch, defer. Preste atenção especial no defer — não existe em PHP.","go.dev/tour","Escreva de cabeça um for que usa defer para fechar um arquivo."],
["2026-07-30",1,"Slices vs Arrays","Tour of Go seção Slices + artigo 'Go Slices: usage and internals'. Escreva um programa mostrando a capacidade de um slice dobrando no append.","go.dev/tour + blog.golang.org","Por que um slice pode 'vazar' memória de um array maior?"],
["2026-07-31",1,"Maps e closures","Tour of Go: maps, function values, closures. Escreva uma função que retorna uma closure (ex: contador).","go.dev/tour","Qual a diferença entre passar uma função e chamar uma função?"],
["2026-08-01",1,"Reposicionamento de marca (fim de semana, até 3h30)","Reescreva LinkedIn e currículo em inglês. Remova 'PHP Developer'. Novo título: Backend Software Engineer — Relational Databases & Distributed Systems (transitioning to Go). Crie README de perfil no GitHub.","LinkedIn + GitHub","Peça pra IA ler seu LinkedIn e apontar o que soa júnior."],
["2026-08-02",1,"Setup de estudo contínuo (fim de semana, até 3h30)","Crie conta no Boot.dev, comece a trilha Learn Go (backend path), 2 primeiros capítulos. Crie repo go-journey no GitHub.","boot.dev","3 coisas que mais surpreenderam em Go vs PHP até agora."],
["2026-08-03",1,"Structs","Boot.dev módulo Structs. Crie 3 structs do seu antigo ERP (Invoice, Customer).","boot.dev","Diferença entre struct em Go e classe em PHP?"],
["2026-08-04",1,"Métodos e receivers","Boot.dev módulo Methods. Foco: receiver por valor vs ponteiro.","boot.dev","Em que situação um receiver por valor causa bug silencioso?"],
["2026-08-05",1,"Interfaces implícitas","Boot.dev módulo Interfaces. Comece o exercício URL Shortener do Gophercises.","gophercises.com/exercises/urlshort","Como Go decide que um tipo implementa uma interface?"],
["2026-08-06",1,"Finalizar URL Shortener","Termine o exercício, adicione armazenamento em arquivo. Commit no GitHub.","gophercises.com","O que mudaria se precisasse trocar arquivo por banco amanhã?"],
["2026-08-07",1,"Erros idiomáticos","if err != nil, fmt.Errorf com %w, errors.Is/As. Refatore o URL Shortener com erros customizados.","go.dev/doc","Por que Go rejeitou exceptions?"],
["2026-08-08",1,"net/http + JSON (fim de semana, até 3h30)","Sem framework: API REST de tarefas em memória com net/http e encoding/json.","boot.dev","Desenhe o fluxo de uma requisição HTTP até a resposta JSON."],
["2026-08-09",1,"Testes básicos (fim de semana, até 3h30)","Leia 2 capítulos de Learn Go With Tests. Escreva seus primeiros testes para a API de tarefas.","quii.gitbook.io/learn-go-with-tests","Liste 3 tópicos que ainda não consegue explicar sem consultar material."],
["2026-08-10",1,"Roteamento","Estude http.ServeMux (e roteamento nativo do Go 1.22+). Reorganize a API com rotas RESTful.","go.dev/doc","Por que Go não vinha com framework web tipo Laravel?"],

  doneMap = lsGet(KEYS.done) || doneMap; notesMap = lsGet(KEYS.notes) || notesMap;
  pipelineMap = lsGet(KEYS.pipe) || pipelineMap; extras = lsGet(KEYS.extras) || extras; checkpoints = lsGet(KEYS.cps) || checkpoints;
  // When served from a local server, the JSON file fills in what the browser does not have yet.
  try{
    const res = await fetch('./go-roadmap-dados.json', {cache:'no-store'});

  if(lastDone){ let d = lastDone; while(doneMap[d]){ streak++; d = addDays(d,-1); } }
  return {done, total:DATES.length, upto:upto.length, late, streak, toGoal:daysBetween(today, GOAL_DATE)};
}

  const done = () => toast('Prompt copiado. Cole no chat da mentoria.');

    navigator.clipboard.writeText(p).then(done).catch(()=>fallbackCopy(p, done));

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Não deu para copiar. Selecione o texto manualmente.'); }
  document.body.removeChild(ta);
}

function weekStart(iso){ const w = dow(iso); return addDays(iso, -((w+6)%7)); }
function renderFunnel(){
  const box = $('funnel');
  const d = currentDate;
  let html = '';
  if(d < FUNNEL_START){
    box.innerHTML = '<p class="hint" style="margin-top:0">As candidaturas começam em 02/11. A partir desse dia, registre aqui o que enviou, as respostas e as entrevistas de cada dia, e a semana aparece somada com um gráfico das últimas 8 semanas.</p>';
    return;
  } else if(DATA_MAP[d]){
    const v = pipelineMap[d] || {};
    html += '<div class="counters">'+PIPE_FIELDS.map(([k,l])=>
      '<div class="counter"><div class="lbl">'+l+' em '+fmtShort(d)+'</div><div class="row"><span class="n">'+(v[k]||0)+'</span>'+
      '<span class="pm"><button class="btn small" data-k="'+k+'" data-d="-1" aria-label="Diminuir '+l+'">−</button><button class="btn small" data-k="'+k+'" data-d="1" aria-label="Aumentar '+l+'">+</button></span></div></div>').join('')+'</div>';
  }
  // totals
  const sum = (filter) => PIPE_FIELDS.map(([k])=>Object.entries(pipelineMap).filter(([day])=>filter(day)).reduce((a,[,v])=>a+(v[k]||0),0));
  const ws = weekStart(d);
  const wk = sum(day=>day>=ws && day<=addDays(ws,6));
  const all = sum(()=>true);
  html += '<div class="totals"><span></span>'+PIPE_FIELDS.map(([,l])=>'<span class="h">'+l+'</span>').join('')+
          '<span class="h">Semana de '+fmtShort(ws)+'</span>'+wk.map(n=>'<span>'+n+'</span>').join('')+
          '<span class="h">Total</span>'+all.map(n=>'<span>'+n+'</span>').join('')+'</div>';
  // last 8 weeks of applications sent
  const weeks = [];
  for(let i=7;i>=0;i--){ const s = addDays(ws, -7*i); weeks.push([s, sum(day=>day>=s && day<=addDays(s,6))[0]]); }
  const max = Math.max(1, ...weeks.map(w=>w[1]));
  html += '<div class="bars" aria-label="Candidaturas enviadas nas últimas 8 semanas">'+weeks.map(([s,n])=>
    '<div class="'+(n?'':'zero')+'" style="height:'+(n/max*100)+'%" title="Semana de '+fmtShort(s)+': '+n+' candidaturas"></div>').join('')+'</div>'+
    '<div class="bars-x">'+weeks.map(([s])=>'<span>'+fmtShort(s)+'</span>').join('')+'</div>'+
    '<p class="hint" style="margin:8px 0 0">Candidaturas enviadas por semana. Meta: 10 a 15.</p>';
  box.innerHTML = html;
  box.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = pipelineMap[d] || (pipelineMap[d] = {});
    v[b.dataset.k] = Math.max(0, (v[b.dataset.k]||0) + Number(b.dataset.d));
    await savePipe(); renderFunnel();
  }));
}

/* ---------- checkpoints ---------- */
function renderCheckpoints(){
  const t = todayISO();
  $('checkpoints').innerHTML = CHECKPOINTS.map(c=>{
    const left = daysBetween(t, c.date);
    const when = left>0 ? 'em '+left+' dias' : left===0 ? 'hoje' : 'há '+(-left)+' dias';
    const st = checkpoints[c.id];
    return '<div class="cp"><div><div class="when">'+fmtShort(c.date)+'</div><div class="left">'+when+'</div></div>'+
      '<div><div class="crit">'+esc(c.label)+': '+esc(c.crit)+'</div><div class="fail">'+esc(c.fail)+'</div>'+
      '<div class="st"><button class="btn small '+(st==='pass'?'on-pass':'')+'" data-cp="'+c.id+'" data-v="pass" aria-pressed="'+(st==='pass')+'">Passou</button>'+
      '<button class="btn small '+(st==='fail'?'on-fail':'')+'" data-cp="'+c.id+'" data-v="fail" aria-pressed="'+(st==='fail')+'">Não passou</button></div></div></div>';
  }).join('');
  $('checkpoints').querySelectorAll('button[data-cp]').forEach(b=>b.addEventListener('click', async ()=>{
    const id=b.dataset.cp, v=b.dataset.v;
    if(checkpoints[id]===v) delete checkpoints[id]; else checkpoints[id]=v;
    await saveCps(); renderCheckpoints(); renderJourney();
  }));
}

/* ---------- extras ---------- */
function renderExtras(){
  const ul = $('extrasList');
  if(!extras.length){ ul.innerHTML = '<li class="hint">Nada pendente. Quando um aprofundamento não couber no dia, anote aqui.</li>'; return; }
  const ordered = extras.map((x,i)=>[x,i]).sort((a,b)=>(a[0].done?1:0)-(b[0].done?1:0));
  ul.innerHTML = ordered.map(([x,i])=>
    '<li class="'+(x.done?'done':'')+'"><input type="checkbox" id="ex'+i+'" data-i="'+i+'" '+(x.done?'checked':'')+'>'+
    '<label for="ex'+i+'" style="flex:1"><span>'+esc(x.text)+'</span><br><small class="hint">anotado em '+fmtShort(x.from)+'</small></label>'+
    '<button class="x" data-del="'+i+'" aria-label="Apagar">×</button></li>').join('');
  ul.querySelectorAll('input[data-i]').forEach(c=>c.addEventListener('change', async ()=>{ extras[c.dataset.i].done = c.checked; await saveExtras(); renderExtras(); }));
  ul.querySelectorAll('button[data-del]').forEach(b=>b.addEventListener('click', async ()=>{ extras.splice(Number(b.dataset.del),1); await saveExtras(); renderExtras(); }));
}
$('extraForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const v = $('extraInput').value.trim(); if(!v) return;
  extras.push({text:v, from:currentDate, done:false}); $('extraInput').value='';
  await saveExtras(); renderExtras(); toast('Extra adicionado.');
});

/* ---------- search ---------- */
function runSearch(){
  const q = $('searchInput').value.trim();
  const box = $('results');
  if(q.length<2){ box.innerHTML = '<p class="hint" style="margin:6px 0 0">'+Object.keys(notesMap).filter(k=>notesMap[k]&&notesMap[k].trim()).length+' dias com anotação. Digite pelo menos 2 letras.</p>'; return; }
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const nq = norm(q);
  const hits = Object.keys(notesMap).sort().reverse().filter(d=>notesMap[d] && norm(notesMap[d]).includes(nq));
  if(!hits.length){ box.innerHTML = '<p class="hint" style="margin:6px 0 0">Nenhuma anotação com "'+esc(q)+'".</p>'; return; }
  box.innerHTML = hits.slice(0,40).map(d=>{
    const text = notesMap[d], i = norm(text).indexOf(nq);
    const a = Math.max(0,i-60), b = Math.min(text.length, i+q.length+80);
    const snip = (a>0?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,b))+(b<text.length?'…':'');
    const f = DATA_MAP[d] ? DATA_MAP[d].focus.replace(/\s*\(fim de semana, até 3h30\)/,'') : '';
    return '<button class="result" data-d="'+d+'"><div class="rd">'+fmtDate(d)+(f?': '+esc(f):'')+'</div><div class="rs">'+snip.replace(/\n+/g,' ')+'</div></button>';
  }).join('');
  box.querySelectorAll('button[data-d]').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.d); window.scrollTo({top:0,behavior:'smooth'}); }));
}
$('searchInput').addEventListener('input', runSearch);

/* ---------- calendar ---------- */
function renderCalendar(){
  const t = todayISO();
  let html = '';
  let [y,m] = FIRST.split('-').map(Number);
  const [ly,lm] = LAST.split('-').map(Number);
  while(y<ly || (y===ly && m<=lm)){
    const first = y+'-'+String(m).padStart(2,'0')+'-01';
    const daysIn = new Date(y,m,0).getDate();
    const lead = (dow(first)+6)%7;
    let cells = '';
    for(let i=0;i<lead;i++) cells += '<span></span>';
    for(let d=1; d<=daysIn; d++){
      const iso = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const e = DATA_MAP[iso];
      if(!e){ cells += '<button class="cell out" disabled tabindex="-1">'+d+'</button>'; continue; }
      const cls = ['cell','in'];
      if(doneMap[iso]) cls.push('ok');
      if(iso===t) cls.push('today');
      if(iso===currentDate) cls.push('sel');
      if(notesMap[iso] && notesMap[iso].trim()) cls.push('has-note');
      const label = fmtDate(iso)+': '+e.focus+(doneMap[iso]?' (concluído)':'');
      cells += '<button class="'+cls.join(' ')+'" style="--c:'+PHASES[e.phase].color+'" data-d="'+iso+'" title="'+esc(label)+'" aria-label="'+esc(label)+'">'+d+'</button>';
    }
    html += '<div class="month"><div class="mname">'+MONTHS[m-1][0].toUpperCase()+MONTHS[m-1].slice(1)+' '+y+'</div>'+
      '<div class="wk">'+['S','T','Q','Q','S','S','D'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="mgrid">'+cells+'</div></div>';
    m++; if(m>12){ m=1; y++; }
  }
  $('months').innerHTML = html;
  $('months').querySelectorAll('button[data-d]').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.d); window.scrollTo({top:0,behavior:'smooth'}); }));
  $('legend').innerHTML = Object.keys(PHASES).map(p=>'<span><i style="background:'+PHASES[p].color+'"></i>'+esc(PHASES[p].name)+'</span>').join('')+
    '<span>Cor cheia: concluído</span><span>Cor clara: pendente</span><span>Ponto amarelo: tem anotação</span>';
}

/* ---------- navigation ---------- */
async function go(iso){ await flushNote(); currentDate = iso; $('noteStatus').textContent=''; renderAll(); }
function renderAll(){ renderJourney(); renderDay(); renderFunnel(); renderCheckpoints(); renderCalendar(); }
$('prevBtn').addEventListener('click', ()=>{ if(currentDate>FIRST) go(addDays(currentDate,-1)); });
$('nextBtn').addEventListener('click', ()=>{ if(currentDate<LAST) go(addDays(currentDate,1)); });
$('todayBtn').addEventListener('click', ()=>go(todayISO()));
$('pendingBtn').addEventListener('click', ()=>go(firstPending()));
document.addEventListener('keydown', ev=>{
  if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName)) return;
  if(ev.key==='ArrowLeft') $('prevBtn').click();
  if(ev.key==='ArrowRight') $('nextBtn').click();
});
window.addEventListener('beforeunload', ()=>{ if(noteTimer){ const v=$('noteInput').value; if(v.trim()) notesMap[currentDate]=v; lsSet(KEYS.notes, notesMap); } });

/* ---------- export / import ---------- */
$('exportJsonBtn').addEventListener('click', async ()=>{
  await flushNote();
  const payload = {doneMap, notesMap, pipelineMap, extras, checkpoints, exportedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='go-roadmap-dados.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('go-roadmap-dados.json exportado.');
});
$('importJsonBtn').addEventListener('click', ()=>$('importJsonInput').click());
$('importJsonInput').addEventListener('change', ev=>{
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.doneMap) doneMap = data.doneMap;
      if(data.notesMap) notesMap = data.notesMap;
      if(data.pipelineMap) pipelineMap = data.pipelineMap;
      if(Array.isArray(data.extras)) extras = data.extras;
      if(data.checkpoints) checkpoints = data.checkpoints;
      await Promise.all([saveDone(), saveNotes(), savePipe(), saveExtras(), saveCps()]);
      renderAll(); renderExtras(); runSearch(); toast('Dados importados.');
    }catch(err){ toast('Esse arquivo não é um JSON válido do painel.'); }
  };
  reader.readAsText(file); ev.target.value='';
});

(async function init(){
  await loadState();
  currentDate = firstPending();
  renderAll(); renderExtras(); runSearch();
})();
</script>
